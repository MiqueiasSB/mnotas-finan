stages:
  - install
  - build
  - deploy

install:
  stage: install
  image: php:8.1-fpm
  script:
    - composer install --no-dev --optimize-autoloader

build:
  stage: build
  image: node:16
  script:
    - npm install
    - npm run prod # ou npm run build, dependendo da configuração do seu projeto
    - npm run production # caso tenha essa configuração em seu package.json
  only:
    - master

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache lftp
  script:
    - lftp -c "set ftp:list-options -a;
               set ssl:verify-certificate no;
               open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
               mirror -R --parallel=10 --delete --exclude-glob .env --exclude-glob .htaccess ./ $FTP_PATH;"
  only:
    - master
