stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache lftp
    # Comandos de otimização do Laravel
    - apk add --no-cache php7 php7-opcache php7-cli php7-fpm php7-mbstring php7-xml php7-pdo php7-mysqli php7-json php7-curl
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan optimize
  script:
    - lftp -c "set ftp:list-options -a;
               set ssl:verify-certificate no;
               open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
               mirror -R --parallel=10 --delete --exclude-glob .env --exclude-glob .htaccess ./ $FTP_PATH;"
  only:
    - master
