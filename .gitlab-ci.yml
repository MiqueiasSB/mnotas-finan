stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache lftp
    - npm install
    - npm run prod
    - composer install --no-dev
    - php artisan config:cacheF
  script:
    # Comando de depuração para lftp
    - lftp -d -c "set ftp:list-options -a;
                  set ssl:verify-certificate no;
                  open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
                  mirror -R --parallel=5 --delete --exclude-glob .env --exclude-glob .htaccess ./ $FTP_PATH;"
  only:
    - master
